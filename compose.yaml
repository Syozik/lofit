services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: lofit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - lofit-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lofit"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/lofit
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      BASE_URL: ${BASE_URL:?set BASE_URL to the URL the app is served from}
      PRICE_REFRESH_MINUTES: ${PRICE_REFRESH_MINUTES:-60}
    command: sh -c "node dist/migrate.js && node dist/server.js"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8787"
    restart: unless-stopped

volumes:
  lofit-db:
