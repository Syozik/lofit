packages:
  - "apps/*"
  - "packages/*"
# esbuild ships its binary as an optional dependency, so its install script
# is not needed; keeping it off leaves dependency scripts disabled.
allowBuilds:
  esbuild: false
linkWorkspacePackages: true
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.10.8'
  - '@turbo/darwin-arm64@2.10.8'
  - '@turbo/linux-64@2.10.8'
  - '@turbo/linux-arm64@2.10.8'
  - '@turbo/windows-64@2.10.8'
  - '@turbo/windows-arm64@2.10.8'
  - turbo@2.10.8
